name: "Split article (always one reading experience)"
description: >
  Two article sections with a CTA in between. They always continue one piece:
  show_toc on the first controls the shared TOC; reading time and mobile TOC
  appear only on the first; desktop side TOC may still appear on the second.
yaml: |
  - paddingY:
      desktop: md
    type: article
    section_id: article-part-1
    show_toc: true
    toc_position: side
    toc_group: bloomtech-review
    content: |
      # BloomTech Review

      An introduction to the program and what changed after the rebrand.

      ## What is BloomTech?

      BloomTech (formerly Lambda School) is a coding bootcamp focused on outcomes.

      ## Who is it for?

      Career switchers and self-taught developers who want structure and career support.

  - type: cta_banner
    title: Ready to compare programs?
    description: See how 4Geeks stacks up before you decide.
    buttons:
      - text: Explore programs
        url: /us/coding-bootcamps
        variant: primary

  - paddingY:
      desktop: md
    type: article
    section_id: article-part-2
    show_toc: false
    toc_group: bloomtech-review
    content: |
      ## Curriculum and outcomes

      A closer look at projects, pacing, and job-search support.

      ### Curriculum

      Full-stack tracks with portfolio projects.

      ### Outcomes

      Reported hiring metrics and what to verify yourself.

      ## Verdict

      Weigh cost, support, and fit for your goals before enrolling.
